<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal To-Do</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <header class="app-header">
      <div class="header-left">
        <div class="brand-badge">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 11 12 14 22 4"></polyline>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
        </div>
        <div>
          <h1 class="app-title">To-Do List</h1>
          <p id="current-date" class="app-subtitle">Today</p>
        </div>
      </div>
      <div class="header-right">
        <span id="task-badge" class="stats-badge">0 tasks</span>
      </div>
    </header>

    <main class="todo-card">
      <!-- Add Task Form -->
      <form id="todo-form" class="todo-input-group" autocomplete="off">
        <div class="input-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </div>
        <input 
          type="text" 
          id="todo-input" 
          class="todo-input" 
          placeholder="Add a new task..." 
          maxlength="150"
          required
          autofocus
        >
        <button type="submit" class="btn-add" id="btn-add" aria-label="Add Task">
          <span>Add</span>
        </button>
      </form>

      <!-- Filter Controls & Actions Bar -->
      <div class="controls-bar">
        <div class="filter-tabs" role="tablist" aria-label="Task filters">
          <button class="filter-tab active" data-filter="all" role="tab" aria-selected="true">
            All <span class="tab-count" id="count-all">0</span>
          </button>
          <button class="filter-tab" data-filter="active" role="tab" aria-selected="false">
            Active <span class="tab-count" id="count-active">0</span>
          </button>
          <button class="filter-tab" data-filter="completed" role="tab" aria-selected="false">
            Completed <span class="tab-count" id="count-completed">0</span>
          </button>
        </div>

        <button id="btn-clear-completed" class="btn-clear-completed" title="Clear all completed tasks" style="display: none;">
          Clear completed
        </button>
      </div>

      <!-- Todo List -->
      <ul id="todo-list" class="todo-list" aria-label="List of tasks">
        <!-- Dynamically injected via JavaScript -->
      </ul>

      <!-- Empty State View -->
      <div id="empty-state" class="empty-state" style="display: none;">
        <div class="empty-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="m9 12 2 2 4-4"></path>
          </svg>
        </div>
        <h3 id="empty-title">All caught up!</h3>
        <p id="empty-desc">No tasks to show. Add a task above to get started.</p>
      </div>
    </main>

    <footer class="app-footer">
      <span>Tip: Click circle to toggle status &bull; Press Enter to add</span>
    </footer>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
